name: llmpod

services:
  llmpod:
    build: .
    image: llmpod:local
    user: "${LLMPOD_UID:-1000}:${LLMPOD_GID:-1000}"
    environment:
      LLMPOD_UI_TOKEN: ${LLMPOD_UI_TOKEN:-}
      LLMPOD_UI_PORT: ${LLMPOD_UI_PORT:-7860}
      # Su Windows i file montati appaiono 0777 e chmod non ha effetto: llmpod salta il controllo dei permessi di .env.
      LLMPOD_HOST_OS: ${LLMPOD_HOST_OS:-}
      LLMPOD_OPENWEBUI_URL: http://127.0.0.1:${LLMPOD_OPENWEBUI_PORT:-3000}
    ports:
      - "127.0.0.1:${LLMPOD_UI_PORT:-7860}:${LLMPOD_UI_PORT:-7860}"
    volumes:
      - "${LLMPOD_CONFIG_DIR:?imposta LLMPOD_CONFIG_DIR (usa scripts/start)}:/config"
      - "${ZCODE_DIR:?imposta ZCODE_DIR (usa scripts/start)}:/zcode"
      - "${PI_DIR:?imposta PI_DIR (usa scripts/start)}:/pi"
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4
    profiles: ["openwebui"]
    depends_on:
      llmpod:
        condition: service_healthy
    environment:
      OPENAI_API_BASE_URL: http://llmpod:8081/v1
      OPENAI_API_KEY: ${LLMPOD_OPENWEBUI_KEY:-}
      ENABLE_PERSISTENT_CONFIG: "false"
      # Accesso con account: il primo che si registra diventa amministratore e, da v0.11.4, il primo account non dipende
      # da ENABLE_SIGNUP; con ENABLE_SIGNUP "false" nessun altro può registrarsi. Senza account una pagina web malevola
      # (o un DNS rebinding) potrebbe usare Open WebUI su localhost come fosse l'utente.
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: "false"
      ENABLE_OLLAMA_API: "false"
    ports:
      - "127.0.0.1:${LLMPOD_OPENWEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui-data:/app/backend/data
    restart: unless-stopped

volumes:
  open-webui-data: {}
